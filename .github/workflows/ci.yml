name: CI

on:
  push:
    branches: [main]
  pull_request:

# A public repository: give the default token nothing it does not need.
permissions:
  contents: read

# One run per ref. A force-push supersedes the run it interrupts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions pyproject.toml claims support for.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[dev]` pulls every engine's extra, because the suite exercises the
      # engines and their fixtures open a PDF to build the invented papers.
      - name: Install
        run: pip install -e ".[dev]"

      # Offline by construction: every PDF the suite reads is invented and
      # built at test time, and OCR and web lookups are faked. No key is read
      # and nothing here can spend.
      - name: Test
        run: pytest -q

  contract-is-installable-alone:
    # The promise a downstream consumer depends on: `alteksto.bundle`, which
    # is the whole format contract, works on a plain install with no
    # third-party package present. The engines are what need the page stack,
    # and they live outside the package precisely so this holds. The suite's
    # own guard reads that off the files; this proves it against a real
    # environment, where the page stack genuinely is not installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: pip install dist/*.whl
      - name: Validate a bundle with the page stack absent
        run: |
          python - <<'PY'
          import importlib.util as u
          for absent in ("pymupdf", "fitz", "lxml"):
              assert u.find_spec(absent) is None, f"{absent} unexpectedly installed"
          import json, pathlib, sys
          from alteksto.bundle import (SCHEMA_VERSION, figure_files,
                                       supplement_dirs, table_files,
                                       validate_bundle)
          root = pathlib.Path("bundle")
          (root / "figures").mkdir(parents=True)
          (root / "tables").mkdir(parents=True)
          (root / "text.md").write_text("# An invented paper\n\nBody.\n")
          (root / "figures" / "table_01.png").write_bytes(b"\x89PNG invented")
          # A spanning header, so the structural check is genuinely exercised
          # here and not just the file listing: the grid is what a consumer
          # installing the contract alone still gets.
          (root / "tables" / "table_01.html").write_text(
              '<table><thead>'
              '<tr><th rowspan="2">Season</th><th colspan="2">Cut</th></tr>'
              '<tr><th>n</th><th>Mean</th></tr></thead>'
              '<tbody><tr><td>April</td><td>12</td><td>4.8</td></tr>'
              '</tbody></table>')
          (root / "manifest.json").write_text(json.dumps({
              "schema_version": SCHEMA_VERSION, "id": "inv-01",
              "title": "An invented paper",
              "exhibits": [{"label": "table_01", "caption": "Table 1.",
                            "notes": "Invented footnote."}],
          }))
          # A supplement, so the whole shape is exercised on a plain
          # install: its own directory, its own crop, and the declaration
          # that binds them.
          supplement = root / "supplements" / "appendix_a"
          (supplement / "figures").mkdir(parents=True)
          (supplement / "text.md").write_text("# Appendix A\n\nProse.\n")
          (supplement / "figures" / "appendix_a_table_01.png").write_bytes(
              b"\x89PNG invented")
          (root / "supplements.json").write_text(json.dumps({
              "id": "inv-01",
              "supplements": [{"name": "appendix_a",
                               "title": "Appendix A. Search strategies",
                               "exhibits": [{"label": "appendix_a_table_01",
                                             "caption": "A table."}]}],
          }))
          assert validate_bundle(root) == [], validate_bundle(root)
          assert list(figure_files(root)) == ["table_01"]
          assert list(table_files(root)) == ["table_01"]
          assert list(supplement_dirs(root)) == ["appendix_a"]
          # One label, one exhibit, across the bundle.
          (root / "supplements.json").write_text(json.dumps({
              "id": "inv-01",
              "supplements": [{"name": "appendix_a", "title": "A",
                               "exhibits": [{"label": "table_01",
                                             "caption": "A clash."}]}],
          }))
          assert any("already declares" in p for p in validate_bundle(root))
          (root / "supplements.json").unlink()
          import shutil; shutil.rmtree(root / "supplements")
          # And the grid check refuses a dropped cell with no parser installed.
          (root / "tables" / "table_01.html").write_text(
              "<table><tr><th>a</th><th>b</th></tr>"
              "<tr><td>only one</td></tr></table>")
          assert any("uncovered" in p for p in validate_bundle(root))
          assert "pymupdf" not in sys.modules
          assert "lxml" not in sys.modules
          print("ok: the contract holds on the standard library alone")
          PY
