[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alteksto"
dynamic = ["version"]
description = "The paper bundle format: markdown full text, cropped figures, manifest. Reads and validates bundles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ed Penington" }]
# Nothing. This package is the format contract (`alteksto.bundle`, which
# enforces docs/bundle.md) and imports the standard library and nothing else,
# and a consumer that only reads and checks bundles is entitled to an install
# that weighs what the contract weighs. Everything that produces a bundle
# lives in `engines/`, outside this package, behind the extras below.
dependencies = []

# No [project.scripts]: the package holds the format and nothing else, and
# validate_bundle.py is run as a script, not an entry point.

[project.optional-dependencies]
# One extra per engine, because an engine declares what it needs and the
# engines share nothing with each other but the contract. `pip install
# alteksto[walk]` is the producing side of the format; a plain install is the
# consuming side. A second engine adds its own extra beside this one, and
# never edits this one.
# What walk needs to open a PDF and read a page.
# 1.24.3 first ships the pymupdf module name; before it, only fitz.
walk = ["pymupdf>=1.24.3", "lxml>=5.0"]
# The suite exercises every engine, so it needs what they all need. Self-
# referential so the floors are declared once, above, and cannot drift from
# the extras the engines are actually installed with. A new engine's extra
# joins this list.
dev = ["alteksto[walk]", "pytest>=8.0"]

[tool.setuptools.dynamic]
version = { attr = "alteksto.__version__" }

# src/ holds the contract and nothing else, so the wheel is the contract and
# nothing else. The engines are checkout code and are never packaged: they
# run as scripts from the repository, and nobody installs an engine to read
# a bundle.
[tool.setuptools.packages.find]
where = ["src"]

# The PEP 561 marker is data, not a module, so it is not picked up by the
# package finder and has to be listed here or the wheel ships without it and
# every type checker ignores the package's annotations.
[tool.setuptools.package-data]
alteksto = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ for the contract, the repository root so `engines.*` and `tests.*`
# resolve. The suite is a package: without that, two engines could not both
# have a test file called test_crop.py.
pythonpath = ["src", "."]
# -rs prints every skip with its reason. Without it a skipped test is a bare
# dot in the output, indistinguishable from a pass. A skip must look like a
# skip.
addopts = "-rs"
# pymupdf's SWIG bindings trip a Python 3.14 deprecation at import time.
# The filter names the exact message so every other warning still shows.
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
